<!DOCTYPE html>
<html>
<head>
<title>Software Effort Estimation - ELM</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:40px;
    width:400px;
    border-radius:12px;
    box-shadow:0px 10px 25px rgba(0,0,0,0.3);
    text-align:center;
}

h2{
    margin-bottom:5px;
}

h3{
    margin-top:0;
    color:gray;
}

input{
    width:90%;
    padding:10px;
    margin:8px 0;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    width:95%;
    padding:12px;
    background:#2a5298;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1e3c72;
}

.result{
    margin-top:20px;
    padding:10px;
    background:#e8f0ff;
    border-radius:6px;
}

.link{
    margin-top:20px;
}

a{
    text-decoration:none;
    color:#2a5298;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Software Development Effort Estimation</h2>
<h3>Using Extreme Learning Machine</h3>

<form method="POST">

<label>Project Size</label><br>
<input type="number" name="project_size" required>

<label>Team Size</label><br>
<input type="number" name="team_size" required>

<label>Experience Level</label><br>
<input type="number" name="experience" required>

<br>

<button type="submit">Predict Effort</button>

</form>

{% if prediction %}
<div class="result">
<h3>Estimated Effort (Hours): {{ prediction }}</h3>
</div>
{% endif %}

<div class="link">
<a href="/comparison">View Algorithm Comparison</a>
</div>

</div>

</body>
</html>
